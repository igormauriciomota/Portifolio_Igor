{% extends "base.html" %}
{% block title %}Entrar | Portfólio{% endblock %}
{% block body %}
<main class="auth-shell">
<form method="post" class="auth-card">{{ form.hidden_tag() }}<a class="brand" href="{{ url_for('main.index') }}">
<span>IM</span>
<strong>Igor Mota</strong>
</a>
<p>ÁREA ADMINISTRATIVA</p>
<h1>Gerenciar portfólio</h1>
<label>{{ form.email.label }}{{ form.email(class='form-control') }}{% for error in form.email.errors %}<small>{{ error }}</small>{% endfor %}</label>
<label>{{ form.password.label }}{{ form.password(class='form-control') }}{% for error in form.password.errors %}<small>{{ error }}</small>{% endfor %}</label>{{ form.submit(class='btn-primary-custom w-100 border-0') }}</form>
</main>
{% endblock %}
