<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#070b17">
  <meta name="description" content="{% block description %}Portfólio de Igor Mota: Python, Flask, Django, SQL, Power BI, análise de dados e sistemas de negócio.{% endblock %}">
  <meta property="og:type" content="website">
  <meta property="og:locale" content="pt_BR">
  <meta property="og:title" content="{% block og_title %}Igor Mota | Python & Dados{% endblock %}">
  <meta property="og:description" content="Tecnologia para transformar dados em decisões.">
  <meta property="og:image" content="{{ url_for('static', filename='assets/og.png', _external=True) }}">
  <meta property="og:url" content="{{ request.url }}">
  <title>{% block title %}Igor Mota | Python & Dados{% endblock %}</title>
  <link rel="icon" href="{{ url_for('static', filename='assets/favicon.svg') }}" type="image/svg+xml">
  <link rel="manifest" href="{{ url_for('main.manifest') }}">
  <link rel="preload" href="{{ url_for('static', filename='assets/igor-portfolio-realistic-v2.webp') }}" as="image" type="image/webp">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/app.css') }}">
  {% block head %}{% endblock %}
</head>
<body class="{% block body_class %}{% endblock %}">
  <a class="skip-link" href="#conteudo">Pular para o conteúdo</a>
  {% with messages = get_flashed_messages(with_categories=true) %}
    {% if messages %}
      <div class="flash-stack" aria-live="polite">
        {% for category, message in messages %}<div class="flash-message flash-{{ category }}">{{ message }}</div>{% endfor %}
      </div>
    {% endif %}
  {% endwith %}

  {% block body %}{% endblock %}

  <script defer src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz" crossorigin="anonymous"></script>
  <script defer src="{{ url_for('static', filename='js/app.js') }}"></script>
  {% block scripts %}{% endblock %}
</body>
</html>
